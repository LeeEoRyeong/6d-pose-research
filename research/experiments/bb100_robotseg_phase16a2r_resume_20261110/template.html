<!doctype html><html lang="ko"><meta charset="utf-8"><title>RobotSeg 후보 검수</title><style>body{font:16px sans-serif;max-width:2100px;background:#eef2f5;margin:auto;padding:1rem}article,header{background:white;padding:1rem;margin-bottom:1rem}img{width:100%}a{margin-right:1rem}.warn{color:#a21}</style><header><h1>RobotSeg gripper 후보 — 6장</h1><p class="warn">모든 출력은 미검수 후보이며 GT가 아닙니다. 전체 영상 빨간 영역은 RobotSeg 예측이며, 확대 영상은 보조 자료입니다.</p></header><main id="list"></main><script>
const data=DATA_PLACEHOLDER;for(const b of data){let e=document.createElement('article'),h=document.createElement('h2');h.textContent=`${b.frame}번 | RobotSeg ${b.robotseg_gripper_pixels}px | SAM에서 제거 ${b.removed_sam_pixels}px`;e.append(h);let p=document.createElement('p');p.textContent=`예측 bbox ${b.gripper_bbox_xywh.join(', ')} (x,y,w,h) · A=C ${b.A_C_identical} · B=D ${b.B_D_identical} · 그리퍼 검출 성공 여부는 직접 확인`;e.append(p);for(const [title,src] of [['전체 프레임 그리퍼 후보',b.full],['확대 비교 A~E',b.panel]]){let t=document.createElement('h3');t.textContent=title;e.append(t);let im=document.createElement('img');im.src=src;im.loading='lazy';e.append(im)}let links=document.createElement('p');for(const [t,n] of [['RobotSeg 후보','robotseg_gripper_NOT_GT'],['SAM','A_sam_NOT_GT'],['CAD∩SAM','B_cad_sam_NOT_GT'],['SAM−RobotSeg','C_sam_minus_gripper_NOT_GT'],['CAD∩SAM−RobotSeg','D_cad_sam_minus_gripper_NOT_GT'],['CAD−RobotSeg','E_cad_minus_gripper_NOT_GT']]){let a=document.createElement('a');a.href=`masks/${String(b.frame).padStart(6,'0')}_${n}.png`;a.textContent=t;a.target='_blank';links.append(a)}e.append(links);document.querySelector('#list').append(e)}</script></html>
