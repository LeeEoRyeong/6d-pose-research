<!doctype html><html lang="ko"><meta charset="utf-8"><title>BB100 visible mask 후보 검수</title><style>body{font:16px sans-serif;max-width:1700px;margin:auto;background:#eff2f6;color:#18212b;padding:1rem}header{background:white;padding:1rem;position:sticky;top:0;z-index:2}article{background:white;padding:1rem;margin:1rem 0;border-radius:8px}img{max-width:100%;height:auto}select,button,input,textarea{font-size:1rem;padding:.4rem}textarea{width:65%;height:3rem}.warn{color:#912b00}.info{line-height:1.5}a{margin-right:1em}</style><header><h1>BB100 Visible Mask 후보 검수</h1><p class="warn">모든 마스크는 미검수 후보입니다. CAD는 가림을 포함한 amodal이며, 교집합과 SAM도 GT가 아닙니다. 보수적 D는 감독 픽셀을 제공하지 않습니다.</p><span id="progress"></span> <label>검색 <input id="search" placeholder="프레임"></label> <select id="filter"><option value="all">전체</option><option value="NONE">가림 없음</option><option value="PARTIAL">부분 가림</option><option value="UNREVIEWED">미검수</option><option value="UNCERTAIN">판단 불가</option></select> <button id="export">검수 CSV 내보내기</button> <label>검수 CSV 가져오기 <input id="import" type="file" accept=".csv"></label><span id="message"></span></header><main id="list"></main><script>
'use strict';const data=DATA_PLACEHOLDER;const key='hcce_16a1_visible_review_v1';let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}const val=b=>state[b.frame]||{status:'UNREVIEWED',method:'C_CAD_SAM',note:''};function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}update()};function update(){document.querySelector('#progress').textContent=`사람 검수 ${data.filter(b=>val(b).status!=='UNREVIEWED').length}/${data.length}`;let q=document.querySelector('#search').value.toLowerCase(),f=document.querySelector('#filter').value;for(const el of document.querySelectorAll('article')){let b=data[+el.dataset.index];el.hidden=!!(q&&!String(b.frame).includes(q))||!(f==='all'||f===b.occlusion||f===val(b).status)}}
for(const [i,b] of data.entries()){let el=document.createElement('article');el.dataset.index=i;let h=document.createElement('h2');h.textContent=`프레임 ${b.frame} | ${b.occlusion} | Pose 그룹 ${b.pose_group}`;el.append(h);let p=document.createElement('p');p.className='info';p.textContent=`선정 이유: ${b.reason} | SAM 출처: ${b.sam_source} | CAD ${b.cad_area_pixels}px, SAM ${b.sam_area_pixels}px, 교집합 ${b.intersection_area_pixels}px (정확도 지표 아님)`;el.append(p);let img=document.createElement('img');img.src=b.panel;img.alt='RGB CAD SAM mask overlay enlarged comparison';img.loading='lazy';el.append(img);let links=document.createElement('p');for(const [title,url] of [['전체 RGB',b.rgb],['CAD amodal',b.cad],['SAM 후보',b.sam],['CAD-SAM 교집합',b.intersection],['불확실 영역',b.uncertainty]]){let a=document.createElement('a');a.textContent=title;a.href=url;a.target='_blank';links.append(a)}el.append(links);let control=document.createElement('p');let method=document.createElement('select');for(const [v,t] of [['C_CAD_SAM','C: CAD ∩ SAM'],['B_SAM','B: SAM'],['A_CAD','A: CAD amodal (visible 아님)'],['D_UNKNOWN','D: 전체 불확실 보류']]){let op=document.createElement('option');op.value=v;op.textContent=t;method.append(op)}method.value=val(b).method;let sel=document.createElement('select');for(const v of ['UNREVIEWED','ACCEPT','CORRECT','UNCERTAIN']){let op=document.createElement('option');op.value=op.textContent=v;sel.append(op)}sel.value=val(b).status;let note=document.createElement('textarea');note.value=val(b).note;method.onchange=()=>{state[b.frame]={...val(b),method:method.value};save()};sel.onchange=()=>{state[b.frame]={...val(b),status:sel.value};save()};note.oninput=()=>{state[b.frame]={...val(b),note:note.value};save()};control.append('검수 대상 ',method,' 상태 ',sel,' 메모 ',note);el.append(control);document.querySelector('#list').append(el)}
for(const x of ['search','filter'])document.querySelector('#'+x).oninput=update;let quote=v=>'"'+String(v??'').replaceAll('"','""')+'"';document.querySelector('#export').onclick=()=>{let rows=[['frame','occlusion','pose_group','method','status','note']];for(const b of data)rows.push([b.frame,b.occlusion,b.pose_group,val(b).method,val(b).status,val(b).note]);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(quote).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='visible_mask_candidate_review.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
function parseCSV(t){let rows=[],row=[],s='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(q){if(c==='"'&&t[i+1]==='"'){s+='"';i++}else if(c==='"')q=false;else s+=c}else if(c==='"')q=true;else if(c===','){row.push(s);s=''}else if(c==='\n'){row.push(s.replace(/\r$/,''));rows.push(row);row=[];s=''}else s+=c}if(row.length||s){row.push(s.replace(/\r$/,''));rows.push(row)}return rows}
document.querySelector('#import').onchange=async e=>{try{let rows=parseCSV((await e.target.files[0].text()).replace(/^\ufeff/,'')),head=rows.shift(),ix={};head.forEach((v,i)=>ix[v]=i);if(!['frame','occlusion','pose_group','method','status','note'].every(v=>v in ix))throw Error('필수 열 누락');let byid=new Map(data.map(b=>[String(b.frame),b])),next={...state},count=0,skip=0;for(const r of rows){let b=byid.get(r[ix.frame]);if(!b||b.occlusion!==r[ix.occlusion]||String(b.pose_group)!==r[ix.pose_group]||!['UNREVIEWED','ACCEPT','CORRECT','UNCERTAIN'].includes(r[ix.status])||!['A_CAD','B_SAM','C_CAD_SAM','D_UNKNOWN'].includes(r[ix.method]))throw Error('프레임·Pose·상태 불일치');if(state[b.frame]&&(state[b.frame].status!=='UNREVIEWED'||state[b.frame].note)){skip++;continue}next[b.frame]={status:r[ix.status],method:r[ix.method],note:r[ix.note]};count++}state=next;save();document.querySelector('#message').textContent=` ${count}개 가져옴, 기존 편집 ${skip}개 보존. 새로고침해 표시.`}catch(err){document.querySelector('#message').textContent='가져오기 실패: '+err.message}};update();</script></html>
