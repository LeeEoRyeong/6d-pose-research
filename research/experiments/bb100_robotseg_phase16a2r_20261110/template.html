<!doctype html><html lang="ko"><meta charset="utf-8"><title>RobotSeg 사전 점검 및 기존 후보 검수</title><style>body{font:16px sans-serif;max-width:1700px;margin:auto;padding:1rem;background:#edf2f5}header{position:sticky;top:0;z-index:2;background:white;padding:1rem}article{background:white;margin:1rem 0;padding:1rem;border-radius:8px}img{max-width:100%}a{margin-right:1rem}select,input,button,textarea{font:inherit;padding:.3rem}textarea{width:65%}.warn{color:#a21;font-weight:bold}</style><header><h1>RobotSeg 실행 차단: 기존 후보 검수</h1><p class="warn">RobotSeg checkpoint 미확보·추론 미실행. 이 페이지의 이미지와 마스크는 이전 SAM/CAD/flow 결과이며 RobotSeg 결과가 아닙니다.</p><span id="progress"></span> <button id="export">검수 기록 CSV 내보내기</button></header><main id="list"></main><script>
'use strict';const data=DATA_PLACEHOLDER,key='bb100_robotseg_blocked_review_v1';let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}const val=b=>state[b.frame]||{status:'UNREVIEWED',note:'',reference_export_attempted:false};function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}document.querySelector('#progress').textContent='검수 '+data.filter(b=>val(b).status!=='UNREVIEWED').length+'/10'}
for(const b of data){let article=document.createElement('article'),h=document.createElement('h2');h.textContent=`프레임 ${b.frame} — ${b.occlusion}`;article.append(h);let warn=document.createElement('p');warn.className='warn';warn.textContent='RobotSeg 그리퍼 mask: 미생성 / C·D·E RobotSeg 차집합: 미생성';article.append(warn);let img=document.createElement('img');img.src=b.panel;img.loading='lazy';img.alt='이전 CAD 및 SAM 확대 비교';article.append(img);let links=document.createElement('p');for(const [title,url] of [['원본 RGB 사본',b.rgb],['SAM 후보 A',b.sam],['CAD∩SAM 후보 B',b.intersection],['CAD amodal',b.cad]]){let a=document.createElement('a');a.href=url;a.textContent=title;a.target='_blank';links.append(a)}article.append(links);if(b.flow){let detail=document.createElement('details'),s=document.createElement('summary');s.textContent='이전 LiteFlowNet 시각화 (RobotSeg 아님)';detail.append(s);let f=document.createElement('img');f.src=b.flow;f.loading='lazy';detail.append(f);article.append(detail)}
let row=document.createElement('p'),sel=document.createElement('select');for(const s of ['UNREVIEWED','ACCEPT_EXISTING','CORRECT','UNCERTAIN']){let opt=document.createElement('option');opt.value=opt.textContent=s;sel.append(opt)}sel.value=val(b).status;let note=document.createElement('textarea');note.value=val(b).note;sel.onchange=()=>{state[b.frame]={...val(b),status:sel.value};save()};note.oninput=()=>{state[b.frame]={...val(b),note:note.value};save()};row.append('기존 후보 검수 ',sel,' 메모 ',note);article.append(row);
let area=document.createElement('p');area.textContent='별도 편집 도구에서 수동 보정한 참조 PNG 불러오기 (1280×720, 불투명, 단일 채널 0/255): ';let file=document.createElement('input');file.type='file';file.accept='image/png';let msg=document.createElement('span'),download=document.createElement('button');download.textContent='수동 참조 PNG 다운로드';download.disabled=true;let reference=null;file.onchange=async()=>{download.disabled=true;reference=null;msg.textContent=' 검사 중';try{let f=file.files[0];if(!f||f.type!=='image/png')throw Error('PNG만 허용');let hdr=new Uint8Array(await f.slice(0,26).arrayBuffer());if(hdr.length<26||hdr[24]!==8||hdr[25]!==0)throw Error('8비트 단일 채널 grayscale PNG 필요');let bmp=await createImageBitmap(f);if(bmp.width!==1280||bmp.height!==720)throw Error('해상도가 1280×720이 아님');let can=document.createElement('canvas');can.width=1280;can.height=720;let ctx=can.getContext('2d',{willReadFrequently:true});ctx.drawImage(bmp,0,0);bmp.close();let a=ctx.getImageData(0,0,1280,720).data;for(let i=0;i<a.length;i+=4)if(a[i]!==a[i+1]||a[i]!==a[i+2]||a[i+3]!==255||(a[i]!==0&&a[i]!==255))throw Error('불투명 이진 단일 채널이 아님');reference=f;download.disabled=false;msg.textContent=' 형식 통과 — 내용 정확도 미검증';}catch(e){msg.textContent=' 오류: '+e.message}};download.onclick=()=>{if(!reference)return;let a=document.createElement('a');a.href=URL.createObjectURL(reference);a.download=`${String(b.frame).padStart(6,'0')}_manual_reference_UNVERIFIED.png`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);state[b.frame]={...val(b),reference_export_attempted:true};save()};area.append(file,download,msg);article.append(area);document.querySelector('#list').append(article)}
const quote=v=>'"'+String(v??'').replaceAll('"','""')+'"';document.querySelector('#export').onclick=()=>{let rows=[['frame','occlusion','existing_candidate_status','note','reference_export_attempted','robotseg_status']];for(const b of data)rows.push([b.frame,b.occlusion,val(b).status,val(b).note,val(b).reference_export_attempted,'NOT_RUN_NO_CHECKPOINT']);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(quote).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='robotseg_blocked_manual_review.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};save();</script></html>
