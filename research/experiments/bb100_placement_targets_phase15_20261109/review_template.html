<!doctype html><html lang="ko"><meta charset="utf-8"><title>BB100 배치 경계 검수</title><style>body{font:16px sans-serif;max-width:1600px;margin:auto;padding:1rem;background:#f2f5f8;color:#18212a}header{position:sticky;top:0;background:#fff;padding:1rem;z-index:2}article{background:white;margin:1rem 0;padding:1rem;border-radius:8px}img{width:49%;height:auto}select,input,button,textarea{font-size:1rem;padding:.4rem}textarea{width:70%;height:3rem}.meta{color:#303f50}.warn{color:#913200}label{margin-right:1rem}</style><header><h1>BB100 객체 배치 경계 검수</h1><p class="warn">자동 후보는 실제 이동 확정이 아닙니다. ACCEPT = 재배치 경계 인정, REJECT = 경계 아님, UNCERTAIN = 판단 불가. CAD 및 영상 차이는 그리퍼·반사 영향이 섞입니다.</p><span id="progress"></span>　<label>검색 <input id="search" placeholder="프레임 ID 또는 B001"></label><label>필터 <select id="filter"><option value="all">전체</option><option value="POSE_CHANGE">Pose 변경</option><option value="SAME_POSE_CHECK">同 Pose</option><option value="UNREVIEWED">미검수</option><option value="UNCERTAIN">판단 불가</option></select></label><button id="export">검수 CSV 내보내기</button> <label>CSV 가져오기 <input type="file" id="import" accept=".csv"></label><span id="msg"></span></header><main id="list"></main><script>
'use strict';const data=DATA_PLACEHOLDER;const key='hcce_phase15_boundary_v1';let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch(e){} update()};const value=b=>state[b.boundary_id]||{status:'UNREVIEWED',note:''};function update(){document.querySelector('#progress').textContent=`검수 ${data.filter(b=>value(b).status!=='UNREVIEWED').length} / ${data.length}`;let q=document.querySelector('#search').value.toLowerCase(),f=document.querySelector('#filter').value;for(const el of document.querySelectorAll('article')){let b=data[Number(el.dataset.idx)],s=value(b).status;el.hidden=!!(q&&!`${b.boundary_id} ${b.before_frame} ${b.after_frame}`.toLowerCase().includes(q))||!(f==='all'||f===b.auto_candidate||f===s)}}
for(const [i,b] of data.entries()){const a=document.createElement('article');a.dataset.idx=i;const h=document.createElement('h2');h.textContent=`${b.boundary_id} : ${b.before_frame} → ${b.after_frame} / ${b.auto_candidate}`;a.append(h);const p=document.createElement('p');p.className='meta';p.textContent=`시간 간격 ${b.seconds.toFixed(3)}초 · GT 회전 ${b.rotation_deg.toFixed(3)}° · 병진 ${b.translation_cad_units.toFixed(3)} CAD 단위 · GT 원점 투영 변화 ${b.gt_origin_projection_change_px.toFixed(2)} px · ROI 회색 MAE ${b.cad_roi_gray_mae.toFixed(2)} · KLT ${b.klt_tracks}개 (이동 중앙값 ${b.klt_median_displacement_px===null?'없음':b.klt_median_displacement_px.toFixed(2)+'px'}) · 외곽 차이 ${b.edge_median_distance_px===null?'없음':b.edge_median_distance_px.toFixed(2)+'px'}`;a.append(p);for(const [src,alt] of [[b.before_img,'이전 RGB·CAD 비교'],[b.after_img,'이후 RGB·CAD 비교']]){let im=document.createElement('img');im.src=src;im.alt=alt;im.loading='lazy';a.append(im)}let controls=document.createElement('p'),sel=document.createElement('select');for(const s of ['UNREVIEWED','ACCEPT','REJECT','UNCERTAIN']){let op=document.createElement('option');op.value=op.textContent=s;sel.append(op)}sel.value=value(b).status;sel.onchange=()=>{state[b.boundary_id]={...value(b),status:sel.value};save()};controls.append('경계 판정: ',sel,'　메모: ');let note=document.createElement('textarea');note.value=value(b).note;note.oninput=()=>{state[b.boundary_id]={...value(b),note:note.value};save()};controls.append(note);a.append(controls);document.querySelector('#list').append(a)}
for(const id of ['search','filter'])document.querySelector('#'+id).oninput=update;function csvCell(v){return '"'+String(v??'').replaceAll('"','""')+'"'}document.querySelector('#export').onclick=()=>{let lines=[['boundary_id','before_frame','after_frame','status','note']];for(const b of data)lines.push([b.boundary_id,b.before_frame,b.after_frame,value(b).status,value(b).note]);let blob=new Blob(['\ufeff'+lines.map(r=>r.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='bb100_placement_boundary_review.csv';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),500)};
function parseCSV(t){let rows=[],row=[],s='',quoted=false;for(let i=0;i<t.length;i++){let c=t[i];if(quoted){if(c==='"'&&t[i+1]==='"'){s+='"';i++}else if(c==='"')quoted=false;else s+=c}else if(c==='"')quoted=true;else if(c===','){row.push(s);s=''}else if(c==='\n'){row.push(s.replace(/\r$/,''));rows.push(row);row=[];s=''}else s+=c}if(row.length||s){row.push(s.replace(/\r$/,''));rows.push(row)}return rows}
document.querySelector('#import').onchange=async e=>{try{let rows=parseCSV((await e.target.files[0].text()).replace(/^\ufeff/,'')),head=rows.shift(),ix={};head.forEach((x,i)=>ix[x]=i);if(!['boundary_id','before_frame','after_frame','status','note'].every(x=>x in ix))throw Error('CSV 열 누락');let mapped=new Map(data.map(b=>[b.boundary_id,b])),next={...state},n=0;for(const r of rows){let b=mapped.get(r[ix.boundary_id]);if(!b||String(b.before_frame)!==r[ix.before_frame]||String(b.after_frame)!==r[ix.after_frame]||!['UNREVIEWED','ACCEPT','REJECT','UNCERTAIN'].includes(r[ix.status]))throw Error('경계 ID, 프레임 또는 판정 불일치');next[b.boundary_id]={status:r[ix.status],note:r[ix.note]};n++}state=next;save();document.querySelector('#msg').textContent=` ${n}개 가져옴. 화면을 새로고침하면 표시됩니다.`}catch(err){document.querySelector('#msg').textContent=' 가져오기 실패: '+err.message}};update();</script></html>
