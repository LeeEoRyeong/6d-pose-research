<!doctype html><html lang="ko"><meta charset="utf-8"><title>BB100 LiteFlowNet 비교</title><style>body{font:16px sans-serif;max-width:1800px;margin:auto;background:#eef1f5;padding:1rem}header{position:sticky;top:0;background:#fff;padding:1rem;z-index:2}article{background:#fff;padding:1rem;margin:1rem 0}img{width:100%;height:auto}select,input,textarea,button{font-size:1rem;padding:.4rem}textarea{width:65%}.warn{color:#a22}a{margin-right:1rem}</style><header><h1>LiteFlowNet + SAM 후보 비교</h1><p class="warn">Flow는 그리퍼 정답이 아닙니다. 마스크 차집합은 탐색용이며 객체 자체를 삭제할 수 있습니다. 노란색은 순·역 불일치이지 가림 GT가 아닙니다.</p><span id="progress"></span> <button id="export">검수 CSV 내보내기</button></header><main id="list"></main><script>
const data=DATA_PLACEHOLDER;const key='bb100_liteflow_review_v1';let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}function val(b){return state[b.mask_prefix]||{status:'UNREVIEWED',note:''}}function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}document.querySelector('#progress').textContent='검수 '+data.filter(x=>val(x).status!=='UNREVIEWED').length+'/6'}
for(const b of data){let el=document.createElement('article'),h=document.createElement('h2');h.textContent=`${b.before_frame} → ${b.after_frame} (${b.hypothesis}, 검증 전 가설)`;el.append(h);let p=document.createElement('p');p.textContent=`시간 ${b.delta_seconds.toFixed(3)}초 / 중간 원본 프레임 ${b.intermediate_rgb_available_ids||'없음'} / Phase15B ${b.phase15b_auto_label} / 배경 gate ${b.phase15b_bg_quality_pass?'PASS':'FAIL: motion 제외 미실행'} / CAD 내 flow 중간 ${b.cad_region_median_flow_px.toFixed(2)}px / FB 일치 ${Math.round(b.fb_consistent_in_cad_fraction*100)}% / SAM 제거 ${b.sam_minus_motion_removed_pixels}/${b.sam_pixels}px`;el.append(p);let im=document.createElement('img');im.src=b.panel;im.alt='전후 영상과 dense flow 및 마스크 후보 비교';el.append(im);let links=document.createElement('p');for(const [t,n] of [['SAM 전','sam_before'],['CAD∩SAM 전','cad_sam_before'],['움직임 후보(그리퍼 아님)','flow_move_not_gripper'],['SAM 후','sam_minus_motion_exploratory'],['CAD∩SAM 후','cad_sam_minus_motion_exploratory'],['FB 불일치','fb_inconsistent']]){let a=document.createElement('a');a.href=`masks/${b.mask_prefix}_${n}_NOT_GT.png`;a.textContent=t;a.target='_blank';links.append(a)}el.append(links);let sel=document.createElement('select');for(const x of ['UNREVIEWED','USEFUL','NOT_USEFUL','UNCERTAIN']){let o=document.createElement('option');o.value=o.textContent=x;sel.append(o)}sel.value=val(b).status;let note=document.createElement('textarea');note.value=val(b).note;sel.onchange=()=>{state[b.mask_prefix]={...val(b),status:sel.value};save()};note.oninput=()=>{state[b.mask_prefix]={...val(b),note:note.value};save()};el.append('검수 ',sel,' 메모 ',note);document.querySelector('#list').append(el)}
let q=x=>'"'+String(x??'').replaceAll('"','""')+'"';document.querySelector('#export').onclick=()=>{let rows=[['before_frame','after_frame','status','note']];for(const b of data)rows.push([b.before_frame,b.after_frame,val(b).status,val(b).note]);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'}));a.download='liteflow_review.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};save();</script></html>
