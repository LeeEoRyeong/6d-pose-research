<!doctype html><html lang="ko"><meta charset="utf-8"><title>BB100 객체 이동 보조 검수</title><style>body{font:16px sans-serif;max-width:1600px;margin:auto;padding:1rem;background:#eff3f6;color:#18212a}header{position:sticky;top:0;background:#fff;padding:1rem;z-index:3}article{background:white;margin:1rem 0;padding:1rem;border-radius:8px}img.panel{width:100%}img.old{width:49%}select,input,button,textarea{font-size:1rem;padding:.4rem}textarea{width:65%;height:3rem}.warn{color:#912b00}.meta{line-height:1.6}.note{font-size:.9rem}</style><header><h1>BB100 객체 이동 보조 검수</h1><p class="warn">자동 결과는 GT가 아닙니다. ACCEPT=재배치 경계, REJECT=재배치 아님, UNCERTAIN=판단 불가. CAD ROI에 그리퍼와 배경이 포함될 수 있습니다.</p><span id="progress"></span> <label>검색 <input id="search" placeholder="B001 또는 프레임"></label> <select id="filter"><option value="all">전체</option><option value="UNCERTAIN">자동 불확실</option><option value="LIKELY_STATIONARY">자동 정지 가능</option><option value="LIKELY_MOVED">자동 이동 가능</option><option value="human_unreviewed">사람 미검수</option><option value="human_uncertain">사람 불확실</option></select> <button id="export">사람 검수 CSV 내보내기</button> <label>기존 Phase 15 CSV 가져오기 <input id="import" type="file" accept=".csv"></label><span id="message"></span></header><main id="list"></main><script>
'use strict';const data=DATA_PLACEHOLDER;const key='hcce_15b_manual_review_v1';let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}const val=b=>state[b.boundary_id]||{status:'UNREVIEWED',note:''};function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}update()};function update(){document.querySelector('#progress').textContent=`사람 검수 ${data.filter(b=>val(b).status!=='UNREVIEWED').length}/${data.length}`;let q=document.querySelector('#search').value.toLowerCase(),f=document.querySelector('#filter').value;for(const e of document.querySelectorAll('article')){let b=data[+e.dataset.index],v=val(b);e.hidden=!!(q&&!`${b.boundary_id} ${b.before_frame} ${b.after_frame}`.toLowerCase().includes(q))||!(f==='all'||f===b.auto_label||(f==='human_unreviewed'&&v.status==='UNREVIEWED')||(f==='human_uncertain'&&v.status==='UNCERTAIN'))}}
for(const [i,b] of data.entries()){let el=document.createElement('article');el.dataset.index=i;let h=document.createElement('h2');h.textContent=`${b.boundary_id} ${b.before_frame} → ${b.after_frame} | 자동: ${b.auto_label}`;el.append(h);let p=document.createElement('p');p.className='meta';p.textContent=`${b.reason} / 가림 ${b.occlusion_before} → ${b.occlusion_after} / 배경 inlier ${b.bg_inliers}, 비율 ${b.bg_inlier_ratio}, 잔차 ${b.bg_median_residual_px}px, 점유 ${b.bg_coverage_4x3}/12 / 배경 품질 ${b.bg_quality_heuristic ? "PASS" : "FAIL — 상대 이동 수치 보류"} / SIFT ${b.sift_inliers}개, 상대 ${b.sift_relative_displacement_px} px / ORB ${b.orb_inliers}개, 상대 ${b.orb_relative_displacement_px} px / 방법 차이 ${b.method_disagreement_px} px / ECC ${b.ecc_score} / 윤곽 차이 ${b.roi_edge_median_distance_px} px`;el.append(p);let im=document.createElement('img');im.src=b.panel;im.className='panel';im.loading='lazy';im.alt='ROI 정렬 전후, 차이, 특징점 대응';el.append(im);let detail=document.createElement('details');let sm=document.createElement('summary');sm.textContent='기존 Phase 15 RGB·CAD 투영 비교 및 GT Pose 보조 정보';detail.append(sm);let info=document.createElement('p');info.textContent=`GT 회전 ${b.gt_rotation_deg_supplement}도, 병진 ${b.gt_translation_cad_units_supplement} CAD 단위 (영상 이동 판단과 별개)`;detail.append(info);for(const src of [b.old_before,b.old_after]){let x=document.createElement('img');x.src=src;x.className='old';x.loading='lazy';detail.append(x)}el.append(detail);let controls=document.createElement('p'),sel=document.createElement('select');for(const s of ['UNREVIEWED','ACCEPT','REJECT','UNCERTAIN']){let opt=document.createElement('option');opt.textContent=opt.value=s;sel.append(opt)}sel.value=val(b).status;sel.onchange=()=>{state[b.boundary_id]={...val(b),status:sel.value};save()};let note=document.createElement('textarea');note.value=val(b).note;note.oninput=()=>{state[b.boundary_id]={...val(b),note:note.value};save()};controls.append('사람 판정 ',sel,' 메모 ',note);el.append(controls);document.querySelector('#list').append(el)}
for(const id of ['search','filter'])document.querySelector('#'+id).oninput=update;const quote=x=>'"'+String(x??'').replaceAll('"','""')+'"';document.querySelector('#export').onclick=()=>{let rows=[['boundary_id','before_frame','after_frame','status','note']];for(const b of data)rows.push([b.boundary_id,b.before_frame,b.after_frame,val(b).status,val(b).note]);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(quote).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='bb100_motion_manual_review.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
function parseCSV(t){let rows=[],row=[],s='',quoted=false;for(let i=0;i<t.length;i++){let c=t[i];if(quoted){if(c==='"'&&t[i+1]==='"'){s+='"';i++}else if(c==='"')quoted=false;else s+=c}else if(c==='"')quoted=true;else if(c===','){row.push(s);s=''}else if(c==='\n'){row.push(s.replace(/\r$/,''));rows.push(row);row=[];s=''}else s+=c}if(row.length||s){row.push(s.replace(/\r$/,''));rows.push(row)}return rows}
document.querySelector('#import').onchange=async e=>{try{let rows=parseCSV((await e.target.files[0].text()).replace(/^\ufeff/,'')),head=rows.shift(),ix={};head.forEach((v,i)=>ix[v]=i);if(!['boundary_id','before_frame','after_frame','status','note'].every(v=>v in ix))throw Error('필수 열 없음');let byid=new Map(data.map(b=>[b.boundary_id,b])),next={...state},count=0,skipped=0;for(const row of rows){let b=byid.get(row[ix.boundary_id]);if(!b||String(b.before_frame)!==row[ix.before_frame]||String(b.after_frame)!==row[ix.after_frame]||!['UNREVIEWED','ACCEPT','REJECT','UNCERTAIN'].includes(row[ix.status]))throw Error('ID·프레임·판정 불일치');if(state[b.boundary_id]&&(state[b.boundary_id].status!=='UNREVIEWED'||state[b.boundary_id].note)){skipped++;continue}next[b.boundary_id]={status:row[ix.status],note:row[ix.note]};count++}state=next;save();document.querySelector('#message').textContent=` ${count}개 가져옴, 기존 편집 ${skipped}개 보존. 새로고침해 표시.`}catch(err){document.querySelector('#message').textContent=' 가져오기 실패: '+err.message}};update();</script></html>
