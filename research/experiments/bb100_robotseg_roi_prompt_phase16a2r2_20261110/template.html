<!doctype html><html lang="ko"><meta charset="utf-8"><title>RobotSeg ROI 점 프롬프트 검수</title><style>body{font:16px sans-serif;max-width:2000px;margin:auto;padding:1rem;background:#eff2f5}header,article{background:white;padding:1rem;margin-bottom:1rem}img{width:100%}a{margin-right:1rem}.warn{color:#a21}</style><header><h1>RobotSeg ROI 및 점 프롬프트 검수</h1><p class="warn">모든 결과는 GT가 아닙니다. 초록 십자=수동 양성, 빨강 십자=수동 음성입니다. ROI 바깥은 추론하지 않았습니다.</p></header><main id="list"></main><script>const data=DATA_PLACEHOLDER;for(const b of data){let e=document.createElement('article'),h=document.createElement('h2');h.textContent=`프레임 ${b.frame}`;e.append(h);for(const [title,path] of [['ROI와 점 원본 좌표',b.full],['접촉부 확대 비교',b.closeup],['전체 ROI 비교',b.overview]]){let t=document.createElement('h3');t.textContent=title;e.append(t);let im=document.createElement('img');im.src=path;im.loading='lazy';e.append(im)}for(const r of b.results){let p=document.createElement('p');p.textContent=`${r.condition}: gripper 후보 ${r.mask_pixels}px · SAM 제거 ${r.SAM_overlap_removed_pixels}px · 양성점 포함 ${r.positive_point_in_mask} · 음성점 포함 ${r.negative_point_in_mask}`;e.append(p);let a=document.createElement('a');a.textContent='그리퍼 PNG';a.href=`masks/${String(b.frame).padStart(6,'0')}_${r.condition}_gripper_NOT_GT.png`;a.target='_blank';e.append(a)}document.querySelector('#list').append(e)}</script></html>
