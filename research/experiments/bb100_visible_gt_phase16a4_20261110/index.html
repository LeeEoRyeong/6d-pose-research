<!doctype html><html lang="ko"><meta charset="utf-8"><title>BB100 전체 Visible Mask 검수</title><style>body{font:15px sans-serif;background:#eef2f5;color:#1c2630;margin:0;padding:1rem}.bar{position:sticky;top:0;background:white;z-index:3;padding:.6rem;box-shadow:0 1px 5px #aaa}button,select,input,textarea{font:inherit;padding:.3rem}.active{background:#145cc1;color:white}.warning{color:#a22;font-weight:bold}.viewport{max-height:76vh;overflow:auto;border:2px solid #738399;background:#222}canvas{display:block;touch-action:none;image-rendering:pixelated}.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin:.35rem 0}textarea{width:36rem;height:2.5rem}</style><div class="bar"><h2>BB100 Visible Mask — 사람 검수 편집기</h2><div class="warning">후보는 GT가 아닙니다. 빨강=보이는 BB(255), 노랑=불확실(128), 투명=배경·그리퍼·구멍(0). 실제 검수 후에만 ACCEPTED를 누르세요.</div><div class="row"><label>프레임 <select id="frame"></select></label><label>초기 후보 <select id="candidate"></select></label><button id="apply">선택 후보로 초기화</button><span id="status"></span><span id="dirty"></span></div><div class="row"><button id="fg">BB 추가 [1]</button><button id="erase">지우기 [2]</button><button id="ignore">불확실 [3]</button><label>브러시 <input id="brush" type="range" min="1" max="120" value="18"><span id="brushv">18</span> px</label><button id="undo">Undo</button><button id="redo">Redo</button><label>확대 <input id="zoom" type="range" min="25" max="600" step="25" value="100"><span id="zoomv">100%</span></label><label>불투명도 <input id="opacity" type="range" min="0" max="100" value="45"></label><label><input type="checkbox" id="outline" checked> CAD 외곽</label></div><div class="row"><button id="draft">DRAFT 저장</button><button id="reviewed">REVIEWED 저장</button><button id="rework">REWORK 저장</button><button id="accepted">ACCEPTED 승인 저장</button><button id="reload">저장본 다시 불러오기</button><textarea id="note" placeholder="수정 내용·가림·구멍·경계 검수 메모"></textarea></div><div id="message"></div></div><p>마스크 값을 128로 남기면 평가에서 제외합니다. 저장본은 버전으로 보존되며 이진 전경과 유효 영역을 함께 저장합니다. 확대 후 스크롤해 경계를 검수하세요.</p><div class="row"><button id="peek_B_SAM">B 후보 비교</button><button id="peek_C_CAD_SAM">C 후보 비교</button><button id="peek_D_SAM_ROBOT">D 후보 비교</button><span id="previewLabel">후보 비교</span><img id="candidatePreview" style="max-width:300px;max-height:170px" alt="후보 마스크 미리보기"></div><div class="viewport"><canvas id="editor"></canvas></div><script src="/app.js"></script></html>
